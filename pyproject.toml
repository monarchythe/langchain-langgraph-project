[project]
name = "langchain-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "monarchythe", email = "nigam.monarchy@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.7",
    "langchain-core>=1.7.3",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langchain-project = "langchain_project:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
